set -g mouse on
# Allow external applications to change the cursor shape
set -g allow-passthrough on
# Allow external applications (like Neovim) to set the system clipboard
set -s set-clipboard on

# Start counting with index 1 (since the 0 key is "off to the right" on the keyboard
# And automatically renumber windows when a window is closed
set -g base-index 1
set -g renumber-windows on

set -g status-position top
set-window-option -g window-status-separator " | "
set-window-option -g window-status-current-style bg=default
set-window-option -g window-status-style bg=default,dim
set -g status-right "#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,} #h %y-%m-%d %H:%M"

bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Make Shift-Enter work properly (e.g., for Claude Code)
set -g allow-passthrough on
set -s extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

# Open new windows and panes in the current directory
bind -N "Create new window" c new-window -c "#{pane_current_path}"
bind -N "Split pane vertically" '"' split-window -c "#{pane_current_path}"
bind -N "Split pane horizontally" % split-window -h -c "#{pane_current_path}"

# Show pane border only when more than one pane
set -g pane-border-status off
set-hook -g window-layout-changed 'if-shell -F "#{>:#{window_panes},1}" "set pane-border-status top" "set pane-border-status off"'

# Set format for pane border (display title if set; otherwise command and path
set -g pane-border-format " [#{pane_index}] #{?#{!=:#{pane_title},#{host}},#{pane_title},#{pane_current_command}} "

# Set keyboard shortcut to rename current pane (set title)
bind-key T command-prompt -p "Pane title:" "select-pane -T '%%'"

# Configure copy-mode to use vi mode and sync with the system keyboard
setw -g mode-keys vi
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Escape send-keys -X cancel

# Note CMD+C is mapped to F13 in my ghostty config
# 1. Register Ghostty's csi:25~ escape sequence as a custom tmux User key
set -s user-keys[0] "\e[25~"
# 2. Map it to copy-pipe in tmux's copy mode (user-keys[0] maps to "User0")
#bind-key -T copy-mode-vi User0 send-keys -X copy-pipe-and-cancel "pbcopy"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

#set -g @plugin 'fabioluciano/tmux-powerkit'
#set -g @powerkit_plugins 'cpu,gpu,ram'
#set -g @powerkit_theme 'catppuccin'

#set -g @plugin 'tmux-plugins/tmux-cpu'

# --- STATUS BAR (Your way, no icons) ---
#set -g status-right "CPU: #{cpu_percentage} GPU: #{gpu_percentage} | %H:%M %d-%b-%y"

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '/opt/homebrew/opt/tpm/share/tpm/tpm'
